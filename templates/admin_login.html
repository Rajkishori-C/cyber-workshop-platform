<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORGANIZER LOGIN - WORKSHOP CTF</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #06090e;
    }
    .login-card {
      background: var(--bg-card);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--neon-cyan);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-title">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      ORGANIZER LOGIN
    </div>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
      Enter the organizer password to manage questions, delete test teams, and set room codes.
    </p>

    {% if error %}
      <div style="background: rgba(255, 51, 102, 0.15); border: 1px solid var(--neon-red); color: var(--neon-red); padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 0.85rem;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <label style="display: block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 6px;">ADMIN PASSWORD</label>
      <input 
        type="password" 
        name="password" 
        class="flag-input" 
        style="width: 100%; margin-bottom: 20px; font-size: 1rem;" 
        placeholder="Default: admin2026" 
        required 
        autofocus
      >
      <button type="submit" class="btn-cyber btn-cyan" style="width: 100%; justify-content: center; padding: 10px; font-size: 1rem;">
        Access Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">&larr; Back to Student Arena</a>
    </div>
  </div>

</body>
</html>
